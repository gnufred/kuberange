---
- name: Create etcd snapshot
  command: etcdctl snapshot save /var/lib/etcd/snap.db

- name: Fetch snapshot
  fetch:
    src: /var/lib/etcd/snap.db
    dest: "files/{{ ansible_facts['date_time']['epoch'] }}.db"
    flat: true

- name: Delete the guest snapshot after fetching it
  file:
    path: /var/lib/etcd/snap.db
    state: absent
